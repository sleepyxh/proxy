# ==========================================
# 1. 机场订阅源 (Proxy Providers)
# ==========================================
proxy-anchor:
  p: &p { type: http, interval: 86400, health-check: { enable: true, url: https://www.apple.com/library/test/success.html, interval: 300 } }

proxy-providers:
  Sub: { <<: *p, url: "https://你的机场订阅链接替换在这里", path: ./proxy_providers/sub.yaml }

# ==========================================
# 2. 核心运行时配置
# ==========================================
mixed-port: 7890
allow-lan: true
log-level: error
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: off

external-controller: "127.0.0.1:9090"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"

profile:
  store-selected: true
  store-fake-ip: true

# ==========================================
# 3. TUN 模式配置
# ==========================================
tun:
  enable: true
  stack: mips
  dns-hijack:
    - "udp://any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ==========================================
# 4. Hosts 与 DNS 配置
# ==========================================
hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  dns.google: [8.8.8.8, 8.8.4.4]

dns:
  enable: true
  ipv6: true
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - rule-set:private_domain
    - rule-set:cn_domain
  default-nameserver:
    - 223.5.5.5
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
  direct-nameserver-follow-policy: true
  nameserver:
    - https://dns.google/dns-query#代理
  nameserver-policy:
    "rule-set:private_domain": "system"
    "rule-set:cn_domain": "https://dns.alidns.com/dns-query"

# ==========================================
# 5. 策略组 (Proxy Groups)
# ==========================================
proxy-groups:
  - { name: 代理, type: select, proxies: [香港, 台湾, 日本, 新加坡, 美国, 其它地区, 全部节点], icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Proxy.svg }
  - { name: AI, type: select, proxies: [代理, 香港, 台湾, 日本, 新加坡, 美国, 其它地区], icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/OpenAI.svg }
  - { name: TG, type: select, proxies: [代理, 香港, 台湾, 日本, 新加坡, 美国, 其它地区], icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Telegram.svg }
  - { name: 香港, type: select, include-all: true, filter: "(?i)🇭🇰|港|hk|hongkong|hong\\s*kong", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/HongKong.svg }
  - { name: 台湾, type: select, include-all: true, filter: "(?i)🇹🇼|台|台北|tw|taiwan|taipei", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Taiwan.svg }
  - { name: 日本, type: select, include-all: true, filter: "(?i)🇯🇵|日|东京|大阪|jp|japan", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Japan.svg }
  - { name: 新加坡, type: select, include-all: true, filter: "(?i)🇸🇬|新|狮城|sg|singapore", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Singapore.svg }
  - { name: 美国, type: select, include-all: true, filter: "(?i)🇺🇸|美|洛杉矶|硅谷|圣何塞|西雅图|us|unitedstates|united\\s*states", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/America.svg }
  - { name: 其它地区, type: select, include-all: true, exclude-filter: "(?i)🇭🇰|港|hk|hongkong|hong\\s*kong|🇹🇼|台|台北|tw|taiwan|taipei|🇯🇵|日|东京|大阪|jp|japan|🇸🇬|新|狮城|sg|singapore|🇺🇸|美|洛杉矶|硅谷|圣何塞|西雅图|us|unitedstates|united\\s*states", icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Global.svg }
  - { name: 全部节点, type: select, include-all: true, icon: https://cdn.jsdmirror.com/gh/AIsouler/MyClash@main/Icons/svg/Global.svg }

# ==========================================
# 6. 远程规则集 (Rule Providers)
# ==========================================
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 代理 }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs, proxy: 代理 }
  text: &text { type: http, interval: 86400, behavior: domain, format: text, proxy: 代理 }

rule-providers:
  cn_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs", path: ./ruleset/cn_domain.mrs }
  geolocation-!cn: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs", path: ./ruleset/geolocation-!cn.mrs }
  apple: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs", path: ./ruleset/apple.mrs }
  private_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs", path: ./ruleset/private_domain.mrs }
  telegram_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs", path: ./ruleset/telegram_domain.mrs }
  youtube_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs", path: ./ruleset/youtube_domain.mrs }
  AI: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs", path: ./ruleset/AI.mrs }
  google_domain: { <<: *domain, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs", path: ./ruleset/google_domain.mrs }
  embydirect: { <<: *text, url: "https://raw.githubusercontent.com/sleepyxh/yxh/mihomo/emby.txt", path: ./ruleset/embydirect.txt }
  cn_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs", path: ./ruleset/cn_ip.mrs }
  private_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs", path: ./ruleset/private_ip.mrs }
  telegram_ip: { <<: *ip, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs", path: ./ruleset/telegram_ip.mrs }

# ==========================================
# 7. 分流规则 (Rules)
# ==========================================
rules:
  - AND,((NETWORK,UDP),(DST-PORT,443),(RULE-SET,youtube_domain)),REJECT
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,apple,DIRECT
  - RULE-SET,embydirect,DIRECT
  - RULE-SET,AI,AI
  - RULE-SET,telegram_domain,TG
  - RULE-SET,telegram_ip,TG,no-resolve
  - RULE-SET,google_domain,代理
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,geolocation-!cn,代理
  - RULE-SET,cn_ip,DIRECT
  - MATCH,代理
